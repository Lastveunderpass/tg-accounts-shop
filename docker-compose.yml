services:
  app:
    build: .
    image: tg-accounts-shop:latest
    container_name: tg-shop
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:${APP_PORT:-8080}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${APP_PORT:-8080}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
